<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema - Aplicações</title>
</head>
<body>
    <h1>Aplicações</h1>
    <ul>
        {% for app in applications %}

        {% endfor %}
    </ul>
</body>
</html>
