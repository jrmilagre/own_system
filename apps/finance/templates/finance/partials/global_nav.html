{% with url_name=request.resolver_match.url_name %}
<div class="bg-[#d4d0c8] px-1 pt-1 flex items-end gap-0.5 border-b border-gray-400 text-xs select-none flex-shrink-0 overflow-x-auto">

    <a href="{% url 'finance:index' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if url_name == 'index' %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Conteúdo</a>

    <a href="{% url 'finance:account_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'account' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Contas</a>

    <a href="{% url 'finance:beneficiary_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'beneficiary' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Beneficiários</a>

    <a href="{% url 'finance:category_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'category' in url_name or 'subcategory' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Categorias</a>

    <a href="{% url 'finance:transaction_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'transaction' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Transações</a>

    <a href="{% url 'finance:scheduler_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'scheduler' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Agendamentos</a>

    <a href="{% url 'finance:asset_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'asset' in url_name or 'inventory' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Investimentos</a>

    <a href="{% url 'finance:budget_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'budget' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Orçamento</a>

    <a href="{% url 'finance:cash_flow_item_list' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'cash_flow' in url_name or 'cash_flow_report' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Fluxo de caixa</a>

    <a href="{% url 'finance:reports_index' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'report' in url_name or url_name == 'reports_index' %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Relatórios</a>

    <a href="{% url 'finance:conectividade_index' %}" class="px-3 py-1 no-underline whitespace-nowrap
        {% if 'conectividade' in url_name or 'transactions_import' in url_name or 'asset_transactions' in url_name %}bg-white text-black font-semibold border-t border-l border-r border-gray-400 -mb-px
        {% else %}text-black hover:bg-gray-100{% endif %}">Conectividade</a>

    <div class="flex-grow"></div>

    <button type="button" class="px-3 py-1 flex items-center gap-1 hover:bg-gray-100 text-black" onclick="window.history.back();">
        <span class="text-blue-600">◁</span> Voltar
    </button>
    <div class="px-2 py-1 bg-red-600 text-white font-bold mr-1">?</div>
</div>
{% endwith %}
